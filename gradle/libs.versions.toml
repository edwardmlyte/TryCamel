[versions]
agp = "8.13.2"
kotlin = "2.2.20"
# NOTE: newest AndroidX (core-ktx 1.17+, material 1.14, espresso 3.7, ext-junit
# 1.3) require Android Gradle Plugin 9.1+. We are pinned to AGP 8.13.2, so these
# are held at their latest AGP-8-compatible releases. Bump together with AGP 9.
coreKtx = "1.16.0"
appcompat = "1.7.1"
material = "1.14.0"
constraintlayout = "2.2.1"
viewpager2 = "1.1.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"
robolectric = "4.16.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
