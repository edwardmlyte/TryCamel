# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run tasks in parallel where projects allow it.
org.gradle.parallel=true

# Reuse task outputs across builds.
org.gradle.caching=true

# Skip the configuration phase when nothing configuration-relevant changed.
org.gradle.configuration-cache=true

# Use AndroidX (not the legacy com.android.support libraries).
android.useAndroidX=true

# Kotlin code style for the Kotlin Gradle plugin.
kotlin.code.style=official

# Only build the resources for the module's declared densities/ABIs, not every
# transitive dependency's. Keeps R class lean.
android.nonTransitiveRClass=true
